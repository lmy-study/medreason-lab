[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medagent-swarm"
version = "0.2.0"
description = "MedReason multi-agent medical research and assistant runtime"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.30", "loguru>=0.7", "PyYAML>=6", "pydantic>=2",
  "tiktoken>=0.7", "pymilvus>=2.4", "milvus-lite>=2.4",
  "sentence-transformers>=2.7", "requests>=2.31",
  "beautifulsoup4>=4.12", "duckduckgo-search>=6"
]

[project.optional-dependencies]
memory = ["mem0ai>=0.1", "redis>=5"]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
medagent-swarm = "medagent_swarm.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
medagent_swarm = ["resources/skills/**/SKILL.md", "resources/skills/**/script/*.py", "retrieval/data/documents/*.txt", "guardrails/*.yaml"]
